services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunbula
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunbula}
      POSTGRES_DB: sunbula
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sunbula:${DB_PASSWORD:-sunbula}@db:5432/sunbula
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sunbula.qa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
